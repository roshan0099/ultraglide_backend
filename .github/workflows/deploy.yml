
name: Deploy to Lambda Web Function

on:
  push:
    branches:
      - main
  workflow_dispatch:

# GitHub needs permission to request an OIDC token.
permissions:
  id-token: write
  contents: read

concurrency:
  group: lambda-web-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: ultraglide-lambda-deployments
  S3_KEY: ultraglide-backend/${{ github.sha }}.zip
  LAMBDA_FUNCTION_NAME: razor-back
  LAMBDA_EXECUTION_ROLE_ARN: arn:aws:iam::908764745671:role/service-role/razor-back-role-epy1mfjp
  LAMBDA_ENDPOINT_URL: https://h11dmvmx25x5hsrp.ww4.lambda-web.us-east-1.on.aws/

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Build deployment package
      - name: Build application
        run: |
          set -e

          mkdir -p build

          cp index.js app.js build/
          cp package.json build/

          cd build

          npm install --omit=dev --ignore-scripts

          cd ..

          echo "Application build completed"

      # 4. Create ZIP
      - name: Package application
        run: |
          set -e

          cd build
          zip -qr ../deploy.zip . -x "*.DS_Store"
          cd ..

          echo "Deployment package size:"
          du -h deploy.zip

      # 5. Configure AWS authentication using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 7. Upload ZIP to S3
      - name: Upload deployment package
        id: upload
        run: |
          set -e

          aws s3 cp deploy.zip \
            s3://${S3_BUCKET}/${S3_KEY}

          VERSION_ID=$(aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "$S3_KEY" \
            --query VersionId \
            --output text)

          if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" = "None" ]; then
            echo "S3 object version ID not found. Check bucket versioning."
            exit 1
          fi

          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

          echo "Uploaded package version: $VERSION_ID"

      # 8. Install/update AWS CLI if lambda-web commands are missing
      - name: Ensure Lambda Web CLI is available
        run: |
          set -e

          if ! aws lambda-web help >/dev/null 2>&1; then
            curl -sSL \
              https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
              -o awscliv2.zip

            unzip -q -o awscliv2.zip
            sudo ./aws/install --update
          fi

          aws lambda-web help >/dev/null

      # 9. Create new Lambda Web Function revision
      - name: Create Lambda Web Function revision
        id: revision
        run: |
          set -e

          jq -n \
            --arg bucket "$S3_BUCKET" \
            --arg key "$S3_KEY" \
            --arg versionId "${{ steps.upload.outputs.version_id }}" \
            '{
              codeConfig: {
                s3Object: {
                  bucket: $bucket,
                  key: $key,
                  versionId: $versionId
                }
              },
              runtimeConfig: {
                runtime: "nodejs24.x"
              }
            }' > build-config.json

          jq -n \
            --arg role "$LAMBDA_EXECUTION_ROLE_ARN" \
            '{
              executionRoleArn: $role
            }' > service-config.json

          REVISION_ID=$(aws lambda-web create-web-function-revision \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --build-config file://build-config.json \
            --service-config file://service-config.json \
            --query revisionId \
            --output text)

          if [ -z "$REVISION_ID" ] || [ "$REVISION_ID" = "None" ]; then
            echo "Failed to create Lambda Web Function revision"
            exit 1
          fi

          echo "revision_id=$REVISION_ID" >> "$GITHUB_OUTPUT"

          echo "Created revision: $REVISION_ID"

      # 10. Wait until the revision is active
      - name: Wait for revision activation
        run: |
          set -e

          aws lambda-web wait web-function-revision-active \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --revision-id "${{ steps.revision.outputs.revision_id }}"

          echo "Revision is now active"

      # 11. Health check
      - name: Verify deployment
        run: |
          set -e

          echo "Checking endpoint: $LAMBDA_ENDPOINT_URL"

          for attempt in $(seq 1 12); do
            RESPONSE=$(curl -sS -o /tmp/response.txt \
              -w "%{http_code}" \
              --max-time 15 \
              "$LAMBDA_ENDPOINT_URL" || true)

            echo "Attempt $attempt: HTTP $RESPONSE"

            if [ "$RESPONSE" = "200" ]; then
              echo "Health check passed!"
              cat /tmp/response.txt
              exit 0
            fi

            sleep 10
          done

          echo "Health check failed after 12 attempts"
          cat /tmp/response.txt || true
          exit 1

      # 12. Deployment summary
      - name: Deployment summary
        if: success()
        run: |
          echo "## Lambda Web Function Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Function: $LAMBDA_FUNCTION_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: ${{ steps.revision.outputs.revision_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Endpoint: $LAMBDA_ENDPOINT_URL" >> "$GITHUB_STEP_SUMMARY"
